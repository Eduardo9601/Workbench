$kind: http-request
name: 'Endereço Residencial (Cidade)'
description: |-
  Retorna o endereço residencial do colaborador. Campo relevante: codCid (→ cidade).
method: POST
url: '{{base_url}}/sapiens_Synccom_senior_g5_rh_fp_hcm'
order: 2000
headers:
  - key: Content-Type
    value: 'text/xml; charset=utf-8'
  - key: SOAPAction
    value: '""'
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ser="http://services.senior.com.br">
      <soapenv:Header>
        <ser:ReqHead>
          <ser:Usuario>{{usuario}}</ser:Usuario>
          <ser:Senha>{{senha}}</ser:Senha>
        </ser:ReqHead>
      </soapenv:Header>
      <soapenv:Body>
        <ser:ConsultaEnderecoResidencial>
          <ser:NumEmp>{{num_empresa}}</ser:NumEmp>
          <ser:TipCol>1</ser:TipCol>
          <ser:NumCad>{{num_cadastro}}</ser:NumCad>
        </ser:ConsultaEnderecoResidencial>
      </soapenv:Body>
    </soapenv:Envelope>
