$kind: http-request
name: 'Histórico de Afastamentos'
description: |-
  Retorna o histórico de afastamentos do colaborador. Campos de saída: sitAfa (→ cod_afastamento), datAfa (→ dta_afastamento_ini), datTer (→ dta_afastamento_fim).
method: POST
url: '{{base_url}}/sapiens_Synccom_senior_g5_rh_fp_historicoscoletivos'
order: 1000
headers:
  - key: Content-Type
    value: 'text/xml; charset=utf-8'
  - key: SOAPAction
    value: '""'
body:
  type: xml
  content: |-
    <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ser="http://services.senior.com.br">
      <soapenv:Header>
        <ser:ReqHead>
          <ser:Usuario>{{usuario}}</ser:Usuario>
          <ser:Senha>{{senha}}</ser:Senha>
        </ser:ReqHead>
      </soapenv:Header>
      <soapenv:Body>
        <ser:Afastamento>
          <ser:NumEmp>{{num_empresa}}</ser:NumEmp>
          <ser:TipCol>1</ser:TipCol>
          <ser:NumCad>{{num_cadastro}}</ser:NumCad>
        </ser:Afastamento>
      </soapenv:Body>
    </soapenv:Envelope>
